<!doctype html><html><head><meta charset="utf-8"><title>Drawing reveal</title>
<link rel="stylesheet" href="../../cad_common/src/common.css">
<style>
#paper{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#credit{left:100px;bottom:70px}
</style></head><body><div id="stage">
<img id="paper" src="../../inputs/shaft/shaft_drawing.png">
<div id="credit" class="credit">Drawing: VEronikapoluyanova · CC0 · Wikimedia Commons</div>
</div>
<script>
const img = document.getElementById('paper'), cr = document.getElementById('credit');
const IW = 2500, IH = 1875;
const s0 = 1000 / IH, c0 = [IW / 2, IH / 2];
const s1 = 1920 / 1880, c1 = [1318, 660];   // main elevation view + dimension chains
const easeIO = f => f <= 0 ? 0 : f >= 1 ? 1 : (f < .5 ? 4*f*f*f : 1 - Math.pow(-2*f + 2, 3) / 2);
const easeOut = f => f <= 0 ? 0 : f >= 1 ? 1 : 1 - Math.pow(1 - f, 3);
window.ready = new Promise(r => { if (img.complete) r(); else img.onload = r; }).then(() => document.fonts.ready);
window.renderAt = t => {
  const e = easeIO((t - 1.3) / 2.2);
  const s = Math.exp(Math.log(s0) + (Math.log(s1) - Math.log(s0)) * e);
  const cx = c0[0] + (c1[0] - c0[0]) * e, cy = c0[1] + (c1[1] - c0[1]) * e;
  const fin = easeOut(t / 0.33);
  img.style.opacity = fin;
  img.style.transform = `translate(${960 - cx * s}px, ${540 - cy * s}px) scale(${s * (0.96 + 0.04 * fin)})`;
  cr.style.opacity = easeOut((t - 2.6) / 0.3);
};
</script></body></html>
