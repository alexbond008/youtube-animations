<!doctype html><html><head><meta charset="utf-8"><title>Fit check</title>
<link rel="stylesheet" href="../../cad_common/src/common.css">
<style>
#vc{left:96px;top:120px;width:1140px;height:840px}
#vc .hd,#lc .hd{position:absolute;left:28px;top:22px;font:700 26px Inter;color:#F5F5F7}
#vc .hd span,#lc .hd span{color:#A1A1AA;font-weight:600}
#img{position:absolute;left:30px;top:90px;width:1080px;height:675px;transform:scale(1.35);transform-origin:50% 50%}
#img img,#img svg{position:absolute;left:0;top:0;width:1080px;height:675px}
#leg{position:absolute;left:30px;bottom:22px;font:600 20px Inter;color:#A1A1AA;display:flex;gap:28px}
#leg i{display:inline-block;width:26px;height:0;border-top:3px dashed #4DA3FF;vertical-align:middle;margin-right:8px}
#leg b{display:inline-block;width:14px;height:14px;border-radius:50%;background:#B9BEC7;vertical-align:-1px;margin-right:8px}
#lc{left:1268px;top:120px;width:556px;height:840px}
.row{position:absolute;left:28px;right:28px;font:500 23px/32px Inter;color:#F5F5F7;opacity:0}
.row .m{font:700 30px Inter;display:inline-block;width:40px}
.row .s{display:block;font:500 19px/27px "JetBrains Mono";color:#A1A1AA;margin-left:40px}
.ok{color:#3DDC97}.bad{color:#FF5A4E}.warn{color:#F5B800}
</style></head><body><div id="stage">
<div id="vc" class="card"><div class="hd">Top view <span>· Claude's enclosure (run 1)</span></div>
 <div id="img"><img src="../work/fit/top_base.png"><svg id="ov" viewBox="0 0 1600 1000"></svg></div>
 <div id="leg"><span><i></i>Arduino Uno outline + holes, official board file</span><span><b></b>Claude's standoffs</span></div></div>
<div id="lc" class="card"><div class="hd">Fit check <span>· measured</span></div><div id="rows"></div></div>
</div>
<script>
// mapping verified on the render: px = 800 + (x-43)*10, py = 500 - (y-35.5)*10 (10 px/mm, ortho top)
const BX = 8.71, BY = 8.83;   // board origin in Claude's model (its bx0, by0)
const P = (x, y) => [800 + (x + BX - 43) * 10, 500 - (y + BY - 35.5) * 10];
const outline = [[0,1],[0,52.34],[1,53.34],[64.516,53.34],[66.04,51.816],[66.04,40.386],[68.58,37.846],[68.58,5.08],[66.04,2.54],[66.04,1],[65.04,0],[1,0],[0,1]];
// official hole (A000066 brd) vs Claude's standoff centre (measured from the FCStd)
const holes = [
  {o:[15.24,50.80], c:[15.2,50.8], d:0.04},
  {o:[66.04,35.56], c:[66.1,35.6], d:0.07},
  {o:[66.04,7.62],  c:[66.1,7.6],  d:0.06},
  {o:[13.97,2.54],  c:[13.9,7.6],  d:5.06},
];
const ov = document.getElementById('ov'), NS = 'http://www.w3.org/2000/svg';
const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); ov.appendChild(e); return e; };
const poly = mk('polyline', {points: outline.map(p => P(...p).join(',')).join(' '), fill: 'rgba(77,163,255,.10)', stroke: '#4DA3FF', 'stroke-width': 4, 'stroke-dasharray': '14 9'});
const plen = outline.reduce((a, p, i) => i ? a + Math.hypot(...P(...p).map((v, k) => v - P(...outline[i-1])[k])) : 0, 0);
const hc = holes.map(h => mk('circle', {cx: P(...h.o)[0], cy: P(...h.o)[1], r: 16, fill: 'none', stroke: '#4DA3FF', 'stroke-width': 4}));
const ring = holes.map(h => mk('circle', {cx: P(...h.o)[0], cy: P(...h.o)[1], r: 34, fill: 'none', stroke: h.d < 0.5 ? '#3DDC97' : '#FF5A4E', 'stroke-width': 5}));
const miss = mk('line', {x1: P(...holes[3].o)[0], y1: P(...holes[3].o)[1], x2: P(...holes[3].c)[0], y2: P(...holes[3].c)[1], stroke: '#FF5A4E', 'stroke-width': 4});
const missT = mk('text', {x: P(...holes[3].o)[0] + 48, y: (P(...holes[3].o)[1] + P(...holes[3].c)[1]) / 2 + 10, fill: '#FF5A4E', 'font-family': 'Inter', 'font-weight': 700, 'font-size': 34}); missT.textContent = '5.1 mm';
const R = [
  [1.0, 'ok', '✓', 'Board fits the cavity', '68.58 × 53.34 in 81 × 66 mm'],
  [2.0, 'ok', '✓', 'Hole · top-left', 'off by 0.04 mm'],
  [2.6, 'ok', '✓', 'Hole · top-right', 'off by 0.07 mm'],
  [3.2, 'ok', '✓', 'Hole · bottom-right', 'off by 0.06 mm'],
  [4.2, 'bad', '✗', 'Hole · bottom-left', 'standoff at y 7.6, hole at y 2.54'],
  [5.4, 'ok', '✓', 'USB-B + jack clear the window', 'USB-B top is tight (~0.5 mm)'],
  [6.4, 'warn', '→', '3 of 4 screws line up', 'fix: move one standoff 5 mm'],
];
const rows = document.getElementById('rows');
const re = R.map(([t, c, m, a, s], i) => { const d = document.createElement('div'); d.className = 'row'; d.style.top = (92 + i * 100) + 'px';
  d.innerHTML = `<span class="m ${c}">${m}</span>${a}<span class="s">${s}</span>`; rows.appendChild(d); return d; });
const ease = f => f <= 0 ? 0 : f >= 1 ? 1 : 1 - Math.pow(1 - f, 3);
window.ready = document.fonts.ready.then(() => new Promise(r => { const i = document.querySelector('#img img'); i.complete ? r() : i.onload = r; }));
window.renderAt = t => {
  document.getElementById('stage').style.opacity = ease(t / 0.3);
  const f = ease((t - 0.5) / 1.0);
  poly.setAttribute('stroke-dasharray', f < 1 ? `${plen * f} ${plen}` : '14 9');
  poly.style.fillOpacity = ease((t - 1.3) / 0.3);
  const ht = [2.0, 2.6, 3.2, 4.2];
  hc.forEach((c, i) => { c.style.opacity = ease((t - 1.2) / 0.3); });
  ring.forEach((c, i) => { const g = ease((ht[i] - 0.1 <= t) ? (t - ht[i] + 0.1) / 0.3 : 0); c.style.opacity = g; c.setAttribute('r', 34 + 18 * (1 - g)); });
  const g = ease((t - 4.4) / 0.4); miss.style.opacity = g; missT.style.opacity = g;
  re.forEach((d, i) => { const e = ease((t - R[i][0]) / 0.3); d.style.opacity = e; d.style.transform = `translateY(${(1 - e) * 10}px)`; });
};
</script></body></html>
