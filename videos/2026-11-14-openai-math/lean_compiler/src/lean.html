<!doctype html><html><head><meta charset="utf-8"><title>Proof.lean</title>
<link rel="stylesheet" href="common.css">
<style>
#win{left:96px;top:210px;width:1728px;height:660px}
#ed{position:absolute;left:0;top:61px;bottom:0;width:1040px;border-right:1px solid #2A2A30}
#code{padding-top:34px}
.ln{font:500 33px/56px "JetBrains Mono",Menlo,monospace;color:#F5F5F7;white-space:pre;display:flex;position:relative}
.ln .no{width:84px;text-align:right;padding-right:30px;color:#4A4A53;flex:none}
.ln.act{background:rgba(255,255,255,.035)}
.ln.act .no{color:#A1A1AA}
.sq{position:relative}
.sq svg{position:absolute;left:0;bottom:-6px;height:10px;width:100%;overflow:visible}
#info{position:absolute;right:0;top:61px;bottom:0;width:686px;background:#131317}
#ihead{height:58px;display:flex;align-items:center;padding:0 34px;font:600 22px Inter;color:#A1A1AA;letter-spacing:.06em;border-bottom:1px solid #222228}
#ibody{padding:30px 34px}
.panel{border-radius:14px;border:2px solid #2A2A30;background:#16161A;padding:22px 26px;font:500 30px/50px "JetBrains Mono",Menlo,monospace;color:#F5F5F7;white-space:pre}
.panel .h{font:700 30px Inter;display:flex;align-items:center;gap:12px;margin-bottom:10px;white-space:normal}
.panel .h svg{width:34px;height:34px}
.hyp{color:#C9C9D1}.hyp b{color:#4DA3FF;font-weight:500}
.goal{color:#F5F5F7}.goal .t{color:#D97757;font-weight:700}
.good{border-color:rgba(61,220,151,.6);background:rgba(61,220,151,.08)}
.good .h{color:#3DDC97;font-size:40px;margin:0}
.good .h svg{width:46px;height:46px}
.err{border-color:rgba(255,90,78,.7);background:rgba(255,90,78,.08)}
.err .h{color:#FF5A4E}
.chk{color:#A1A1AA;font:600 28px Inter}
</style></head><body><div id="stage">
<div class="win" id="win">
  <div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="wtitle"><b>Proof.lean</b><span>&mdash; editor</span></div>
  <div id="ed"><div id="code"></div></div>
  <div id="info"><div id="ihead">GOALS</div><div id="ibody"></div></div>
</div>
</div>
<script src="common.js"></script>
<script>
// Real Lean 4 + Mathlib (sq_nonneg : 0 ≤ a ^ 2). Wrong step: `rw [add_comm]` leaves 0 ≤ b ^ 2 + a ^ 2 -> "unsolved goals".
const L=[
 '<span class="k">import</span> Mathlib',
 '',
 '<span class="k">theorem</span> <span class="f">sum_sq_nonneg</span> (a b : <span class="ty">ℝ</span>) :',
 '    <span class="n">0</span> ≤ a ^ <span class="n">2</span> + b ^ <span class="n">2</span> := <span class="k">by</span>',
 '  <span class="k">have</span> ha : <span class="n">0</span> ≤ a ^ <span class="n">2</span> := sq_nonneg a',
 '  <span class="k">have</span> hb : <span class="n">0</span> ≤ b ^ <span class="n">2</span> := sq_nonneg b',
 null];
const GOOD='linarith', BAD='rw [add_comm]';
const code=document.getElementById('code'), ib=document.getElementById('ibody');
const SQ='<svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 5 '+Array.from({length:25},(_,i)=>`L${i*4+2} ${i%2?8:2}`).join(' ')+' L100 5" fill="none" stroke="#FF5A4E" stroke-width="2.6" vector-effect="non-scaling-stroke"/></svg>';
function lastLine(t){
  // 6.0-6.27 delete linarith, 6.3-6.7 type rw; 9.2-9.6 delete rw, 9.62-9.9 type linarith
  if(t<6.0) return {txt:GOOD,cur:false};
  if(t<6.3){const k=Math.max(0,GOOD.length-Math.floor((t-6.0)*32));return {txt:GOOD.slice(0,k),cur:true};}
  if(t<9.2){const s=typed(BAD,t,6.3,32);return {txt:s,cur:t<7.0};}
  if(t<9.62){const k=Math.max(0,BAD.length-Math.floor((t-9.2)*32));return {txt:BAD.slice(0,k),cur:true};}
  return {txt:typed(GOOD,t,9.62,32),cur:t<10.0};
}
const fmt7=s=>s.startsWith('rw')?s.replace(/^rw/,'<span class="k">rw</span>'):`<span class="p">${s}</span>`;
const HYP=['<span class="hyp"><b>a b</b> : ℝ</span>','<span class="hyp"><b>ha</b> : 0 ≤ a ^ 2</span>','<span class="hyp"><b>hb</b> : 0 ≤ b ^ 2</span>'];
const goal=g=>`<span class="goal"><span class="t">⊢</span> ${g}</span>`;
window.renderAt=t=>{
  const ll=lastLine(t);
  const sqOn=t>=7.5&&t<9.2;
  const sqE=enter(t,7.5,8);
  // active line: steps through 4,5,6,7 during 0.6..3.0, then 7
  let act=t<0.6?-1:t<1.4?3:t<2.2?4:t<3.0?5:6;
  code.innerHTML=L.map((l,i)=>{
    let body=l;
    if(l===null){body='  '+(sqOn?`<span class="sq">${fmt7(ll.txt)}<svg viewBox="0 0 100 10" preserveAspectRatio="none" style="clip-path:inset(0 ${100-100*sqE}% 0 0)">${SQ.slice(SQ.indexOf('>')+1,-6)}</svg></span>`:fmt7(ll.txt))+(ll.cur&&blink(t)||ll.cur&&t>=6&&t<9.9?'<span class="cur"></span>':'');}
    const op=enter(t,0.05+i*0.07,9);
    return `<div class="ln${i===act?' act':''}" style="opacity:${op}"><span class="no">${i+1}</span><span>${body}</span></div>`;
  }).join('');
  let h='', pulse=0;
  const swap=t0=>enter(t,t0,7);
  if(t<0.6){h='';}
  else if(t<1.4){h=`<div class="panel" style="opacity:${swap(0.6)}"><div class="h" style="color:#A1A1AA">1 goal</div>${HYP[0]}\n${goal('0 ≤ a ^ 2 + b ^ 2')}</div>`;}
  else if(t<2.2){h=`<div class="panel"><div class="h" style="color:#A1A1AA">1 goal</div>${HYP[0]}\n<span style="opacity:${swap(1.4)}">${HYP[1]}</span>\n${goal('0 ≤ a ^ 2 + b ^ 2')}</div>`;}
  else if(t<3.0){h=`<div class="panel"><div class="h" style="color:#A1A1AA">1 goal</div>${HYP[0]}\n${HYP[1]}\n<span style="opacity:${swap(2.2)}">${HYP[2]}</span>\n${goal('0 ≤ a ^ 2 + b ^ 2')}</div>`;}
  else if(t<6.0){const e=swap(3.0);pulse=t>4.0?0.5+0.5*Math.sin((t-4.0)*Math.PI*1.1):0;
    h=`<div class="panel good" style="opacity:${e};transform:scale(${0.92+0.08*e});box-shadow:0 0 ${26*pulse}px rgba(61,220,151,${.3*pulse})"><div class="h">${CHECK}<span>No goals</span></div></div>`;}
  else if(t<7.5){const n=1+Math.floor((t-6.0)*5)%3;h=`<div class="chk">checking${'.'.repeat(n)}</div>`;}
  else if(t<9.2){const e=swap(7.5);
    h=`<div class="panel err" style="opacity:${e};transform:scale(${0.92+0.08*e})"><div class="h">${CROSS}<span>unsolved goals</span></div>${HYP[0]}\n${HYP[1]}\n${HYP[2]}\n${goal('0 ≤ b ^ 2 + a ^ 2')}</div>`;}
  else if(t<10.0){const n=1+Math.floor((t-9.2)*5)%3;h=`<div class="chk">checking${'.'.repeat(n)}</div>`;}
  else {const e=swap(10.0);pulse=t>10.6?0.5+0.5*Math.sin((t-10.6)*Math.PI*1.1):0;
    h=`<div class="panel good" style="opacity:${e};transform:scale(${0.92+0.08*e});box-shadow:0 0 ${26*pulse}px rgba(61,220,151,${.3*pulse})"><div class="h">${CHECK}<span>No goals</span></div></div>`;}
  ib.innerHTML=h;
};
window.renderAt(0);
</script></body></html>
