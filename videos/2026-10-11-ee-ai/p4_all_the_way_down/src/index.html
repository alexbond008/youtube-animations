<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0;padding:0;background:#0E0E10;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#0E0E10;
  background-image:radial-gradient(circle at 12px 12px,#23232A 1.2px,transparent 1.7px);background-size:24px 24px}
#world{position:absolute;inset:0}
.scene{position:absolute;left:0;top:0;width:100%;height:100%}
.scene svg,#ui svg{position:absolute;left:0;top:0;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="mb" x="0" y="0" width="100%" height="100%"><feGaussianBlur id="mbBlur" stdDeviation="0 0"/></filter>
</defs></svg>
<div id="stage"><div id="world"></div><div id="ui"></div></div>
<script>
const Q = new URLSearchParams(location.search);
const VERT = Q.get('mode') === 'vert';
const W = VERT ? 1080 : 1920, H = VERT ? 1350 : 1080;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- palette / helpers ----------
const BG = '#0E0E10', CARD = '#16161A', BORDER = '#2A2A30', TXT = '#F5F5F7', SEC = '#A1A1AA', OR = '#D97757', BLUE = '#4DA3FF', GREEN = '#3DDC97', DIM = '#8A8A94';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const f2 = x => (+x).toFixed(2);
function T(x, y, s, o = {}) {
  const fam = o.mono ? "'JetBrains Mono'" : 'Inter';
  return `<text x="${f2(x)}" y="${f2(y)}" font-family="${fam}" font-size="${o.size || 46}" font-weight="${o.w || (o.mono ? 700 : 600)}" fill="${o.fill || TXT}" text-anchor="${o.anchor || 'middle'}" opacity="${o.op == null ? 1 : f2(o.op)}">${esc(s)}</text>`;
}
const R = (x, y, w, h, r, fill, stroke, sw = 2, extra = '') => `<rect x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}" rx="${r}" fill="${fill}" stroke="${stroke || 'none'}" stroke-width="${sw}" ${extra}/>`;
const card = (x, y, w, h) => R(x, y, w, h, 16, CARD, BORDER, 1.5, 'filter="url(#shadow)"');
const popG = (cx, cy, p, inner) => `<g opacity="${f2(p)}" transform="translate(${f2(cx)} ${f2(cy)}) scale(${f2(.92 + .08 * p)}) translate(${f2(-cx)} ${f2(-cy)})">${inner}</g>`;
const frac = x => x - Math.floor(x);

// ---------- layers ----------
const LAYERS = [
  { id: 'next_token', name: 'Next-token prediction', short: 'Tokens', start: 0 },
  { id: 'network_cloud', name: 'Network / Cloud', short: 'Network', start: 3.5 },
  { id: 'data_centre', name: 'Data centre', short: 'Data centre', start: 7 },
  { id: 'gpu', name: 'GPU', short: 'GPU', start: 10.5 },
  { id: 'cpu', name: 'CPU', short: 'CPU', start: 14 },
  { id: 'transistor', name: 'Transistor', short: 'Transistor', start: 17 },
  { id: 'logic_gates', name: 'Logic gates', short: 'Logic gates', start: 20 },
  { id: 'zeros_ones', name: '0s and 1s', short: '0s & 1s', start: 23 },
];
const TRANS = 0.6;
const BW = 1100, BH = 760;
const S = VERT ? 0.9 : 1.1;
const OX = VERT ? 555 - BW * S / 2 : 1150 - BW * S / 2;
const OY = VERT ? 770 - BH * S / 2 : 590 - BH * S / 2;
const CHIP_X = VERT ? 60 : OX, CHIP_Y = VERT ? 96 : 52;

// ---------- scene 1: next-token ----------
function s1(lt) {
  let o = card(20, 40, 1060, 680);
  o += `<circle cx="84" cy="116" r="22" fill="${OR}"/>` + T(124, 132, 'model', { size: 46, fill: SEC, anchor: 'start' });
  const toks = ['The', 'cat', 'sat', 'on', 'the'];
  let x = 50;
  toks.forEach((tk, i) => {
    const w = tk.length * 31.2 + 44, p = eo((lt - (0.15 + 0.3 * i)) / 0.25);
    o += popG(x + w / 2, 222, p, R(x, 180, w, 84, 16, '#1F1F26', '#3A3A44') + T(x + w / 2, 240, tk, { mono: 1, size: 52, w: 500 }));
    x += w + 14;
  });
  const sw = 3 * 31.2 + 44, sp = eo((lt - 1.65) / 0.25), chosen = lt > 2.85, cp = eo((lt - 2.85) / 0.25);
  if (sp > 0) {
    if (!chosen) {
      const blink = (Math.floor(lt * 3.2) % 2) ? .55 : 1;
      o += popG(x + sw / 2, 222, sp, `<rect x="${x}" y="180" width="${sw}" height="84" rx="16" fill="${OR}" fill-opacity=".10" stroke="${OR}" stroke-width="3" stroke-dasharray="10 8"/>` + T(x + sw / 2, 240, '?', { mono: 1, size: 52, fill: OR, op: blink }));
    } else {
      o += popG(x + sw / 2, 222, cp, `<rect x="${x}" y="180" width="${sw}" height="84" rx="16" fill="${OR}" fill-opacity=".22" stroke="${OR}" stroke-width="3" filter="url(#glowS)"/>` + T(x + sw / 2, 240, 'mat', { mono: 1, size: 52, fill: OR }));
    }
  }
  const hp = eo((lt - 1.75) / 0.3);
  o += T(50, 372, 'next token?', { size: 46, fill: SEC, anchor: 'start', op: hp });
  const rows = [['mat', .62, OR], ['sofa', .21, '#5A5A66'], ['roof', .09, '#5A5A66']];
  rows.forEach((r, k) => {
    const ry = 408 + k * 100, gp = eo((lt - 1.95 - 0.15 * k) / 0.6), vis = eo((lt - 1.85 - 0.1 * k) / 0.25);
    if (k === 0) o += `<rect x="36" y="${ry - 8}" width="1008" height="84" rx="14" fill="#F5B800" fill-opacity="${f2(.14 * vis)}" stroke="${OR}" stroke-opacity="${f2(.6 * vis)}" stroke-width="2"/>`;
    o += `<g opacity="${f2(vis)}">` + T(60, ry + 50, r[0], { mono: 1, size: 52, w: 500, anchor: 'start', fill: k === 0 ? OR : TXT });
    o += R(250, ry + 12, 560, 48, 12, '#23232A', null) + R(250, ry + 12, Math.max(0.01, 560 * r[1] * gp), 48, 12, r[2], null);
    o += T(250 + 560 * r[1] * gp + 22, ry + 52, Math.round(r[1] * gp * 100) + '%', { mono: 1, size: 48, anchor: 'start', fill: k === 0 ? OR : SEC }) + '</g>';
  });
  return o;
}

// ---------- scene 2: network / cloud ----------
const CLOUD = 'M -90 60 H 80 A 50 50 0 0 0 85 -40 A 70 70 0 0 0 -50 -50 A 60 60 0 0 0 -90 60 Z';
function bez(p0, p1, p2, p3, t) { const u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]; }
function s2(lt) {
  let o = '';
  const ys = [175, 375, 575], hub = [560, 375], cl = [930, 375];
  const lp = eo((lt - 0.45) / 0.6);
  ys.forEach((y, k) => {
    const d = `M 190 ${y} C 380 ${y} 380 375 490 375`;
    o += `<path d="${d}" fill="none" stroke="#3A3A44" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${f2(1 - lp)}"/>`;
  });
  o += `<line x1="630" y1="375" x2="800" y2="375" stroke="#3A3A44" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${f2(1 - lp)}"/>`;
  // devices
  ys.forEach((y, k) => {
    const p = eo((lt - 0.2 - 0.12 * k) / 0.3);
    o += popG(115, y, p, R(40, y - 60, 150, 100, 14, CARD, '#3A3A44', 3) + R(54, y - 46, 122, 72, 6, '#1F1F26', null) + `<rect x="75" y="${y + 40}" width="80" height="12" rx="6" fill="#3A3A44"/>` + `<rect x="62" y="${y - 38}" width="${40 + 30 * hash(k + Math.floor(lt * 2))}" height="8" rx="4" fill="${OR}" opacity=".7"/><rect x="62" y="${y - 20}" width="${70 * hash(k * 3 + 1)}" height="8" rx="4" fill="#5A5A66"/>`);
  });
  const hp = eo((lt - 0.4) / 0.3);
  o += popG(560, 375, hp, `<circle cx="560" cy="375" r="76" fill="${CARD}" stroke="#5A5A66" stroke-width="4"/><circle cx="560" cy="375" r="46" fill="none" stroke="${BLUE}" stroke-width="4" opacity=".8"/><circle cx="560" cy="375" r="18" fill="${BLUE}"/>`);
  // cloud
  const cp = eo((lt - 0.55) / 0.35), ring = frac(lt * 0.9);
  o += `<g opacity="${f2(cp)}"><circle cx="${cl[0]}" cy="${cl[1]}" r="${f2(170 + 70 * ring)}" fill="none" stroke="${OR}" stroke-width="3" opacity="${f2(.5 * (1 - ring) * clamp((lt - 1.1) / .3))}"/>`;
  o += `<g transform="translate(${cl[0]} ${cl[1] - 5}) scale(1.35)"><path d="${CLOUD}" fill="${CARD}" stroke="#F5F5F7" stroke-width="3.5"/></g></g>`;
  // packets
  const pk = clamp((lt - 1.0) / 0.2);
  if (pk > 0) {
    ys.forEach((y, k) => {
      for (let n = 0; n < 3; n++) {
        const t = frac(lt * 0.62 + n / 3 + k * 0.21);
        const P = bez([190, y], [380, y], [380, 375], [490, 375], t);
        const fade = Math.min(1, t * 8, (1 - t) * 8);
        o += `<rect x="${f2(P[0] - 15)}" y="${f2(P[1] - 10)}" width="30" height="20" rx="5" fill="${OR}" opacity="${f2(fade * pk)}" filter="url(#glowS)"/>`;
      }
    });
    for (let n = 0; n < 5; n++) {
      const t = frac(lt * 0.9 + n / 5), x = lerp(630, 810, t);
      const fade = Math.min(1, t * 8, (1 - t) * 8);
      o += `<rect x="${f2(x - 15)}" y="${375 - 10}" width="30" height="20" rx="5" fill="${n % 2 ? TXT : OR}" opacity="${f2(fade * pk)}" filter="url(#glowS)"/>`;
    }
  }
  const lb = eo((lt - 0.7) / 0.3);
  o += T(115, 715, 'Devices', { op: lb }) + T(560, 715, 'Router', { op: lb }) + T(930, 715, 'Cloud', { op: lb });
  return o;
}

// ---------- scene 3: data centre ----------
function s3(lt) {
  let o = '';
  for (let i = 0; i < 4; i++) {
    const rx = 30 + i * 265, p = eo((lt - 0.35 - 0.1 * i) / 0.35);
    let g = R(rx, 20, 235, 510, 16, CARD, BORDER, 1.5, 'filter="url(#shadow)"');
    for (let j = 0; j < 9; j++) {
      const uy = 40 + j * 54;
      g += R(rx + 14, uy, 207, 44, 8, '#1E1E24', '#2A2A30', 1.5);
      for (let v = 0; v < 3; v++) g += `<rect x="${rx + 28}" y="${uy + 12 + v * 9}" width="46" height="3" rx="1.5" fill="#33333C"/>`;
      for (let k = 0; k < 3; k++) {
        const h = hash(i * 977 + j * 31 + k * 7 + Math.floor(lt * 5 + hash(i * 3 + j) * 3) * 13);
        const on = h > .28, col = k === 2 && h > .8 ? OR : GREEN;
        g += `<circle cx="${rx + 163 + k * 18}" cy="${uy + 22}" r="5.5" fill="${on ? col : '#2E2E36'}" ${on ? 'filter="url(#glowS)"' : ''}/>`;
      }
    }
    o += `<g opacity="${f2(p)}" transform="translate(0 ${f2(24 * (1 - p))})">${g}</g>`;
  }
  const mp = eo((lt - 0.7) / 0.4), fill = eo((lt - 0.9) / 2.0);
  let m = card(30, 560, 1040, 170);
  const bolt = `<polygon points="0,-44 -26,6 -4,6 -14,44 28,-10 4,-10" fill="${OR}" filter="url(#glowS)"/>`;
  m += `<g transform="translate(88 645)">${bolt}</g>` + T(140, 630, 'Power draw', { size: 46, fill: SEC, anchor: 'start' });
  m += T(140, 704, Math.round(64 * fill) + ' MW', { mono: 1, size: 64, anchor: 'start' });
  m += R(540, 610, 490, 44, 22, '#23232A', null);
  m += `<defs><linearGradient id="pg"><stop offset="0" stop-color="#F5B800"/><stop offset="1" stop-color="${OR}"/></linearGradient></defs>`;
  m += R(540, 610, Math.max(1, 490 * fill), 44, 22, 'url(#pg)', null);
  for (let k = 1; k < 5; k++) m += `<rect x="${540 + k * 98}" y="610" width="2" height="44" fill="${CARD}"/>`;
  o += `<g opacity="${f2(mp)}">${m}</g>`;
  return o;
}

// ---------- scene 4: GPU ----------
function s4(lt) {
  let o = '';
  const p0 = eo((lt - 0.3) / 0.4);
  o += `<g opacity="${f2(p0)}">` + R(40, 60, 1020, 580, 24, CARD, BORDER, 1.5, 'filter="url(#shadow)"') + '</g>';
  // traces
  const sp = eo((lt - 0.6) / 0.4);
  [235, 300, 405, 470].forEach(y => {
    [[250, 330], [770, 850]].forEach(([a, b]) => { o += `<line x1="${a}" y1="${y + 15}" x2="${b}" y2="${y + 15}" stroke="#2F2F38" stroke-width="3" opacity="${f2(sp)}"/>`; });
  });
  // HBM
  [[90, 130], [90, 390], [850, 130], [850, 390]].forEach(([x, y], k) => {
    const p = eo((lt - 0.5 - 0.1 * k) / 0.35);
    let g = '';
    for (let l = 0; l < 4; l++) g += R(x, y + l * 42, 160, 34, 8, 'rgba(77,163,255,.16)', BLUE, 2.5);
    o += popG(x + 80, y + 80, p, g);
  });
  // data dots
  if (lt > 1.0) {
    [[250, 330, 0], [770, 850, 1]].forEach(([a, b, d]) => [235, 300, 405, 470].forEach((y, k) => {
      const t = frac(lt * 0.9 + k * 0.27 + d * 0.5), x = d ? lerp(b, a, t) : lerp(a, b, t);
      o += `<circle cx="${f2(x)}" cy="${y + 15}" r="6" fill="${BLUE}" filter="url(#glowS)"/>`;
    }));
  }
  // die
  const dp = eo((lt - 0.4) / 0.4);
  let die = R(330, 110, 440, 440, 16, '#1A1A20', '#4A4A56', 3);
  for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++) {
    const v = Math.pow(.5 + .5 * Math.sin(0.62 * (i + j) - lt * 6.2), 3) * eo((lt - 0.8 - 0.015 * (i + j)) / 0.3);
    die += R(350 + i * 40, 130 + j * 40, 32, 32, 6, '#272730', null);
    die += `<rect x="${350 + i * 40}" y="${130 + j * 40}" width="32" height="32" rx="6" fill="${OR}" opacity="${f2(v)}"/>`;
  }
  o += popG(550, 330, dp, die);
  const lb = eo((lt - 0.9) / 0.3);
  o += T(170, 706, 'HBM', { fill: BLUE, op: lb }) + T(550, 706, 'thousands of cores', { op: lb }) + T(930, 706, 'HBM', { fill: BLUE, op: lb });
  return o;
}

// ---------- scene 5: CPU ----------
function s5(lt) {
  let o = '';
  const pp = eo((lt - 0.35) / 0.4);
  let g = '';
  for (let i = 0; i < 12; i++) {
    const a = 360 + 14 + i * 30.5;
    g += `<rect x="${a}" y="86" width="12" height="30" rx="3" fill="#4A4A56"/><rect x="${a}" y="544" width="12" height="30" rx="3" fill="#4A4A56"/>`;
    const b = 130 + 14 + i * 30.5;
    g += `<rect x="326" y="${b}" width="30" height="12" rx="3" fill="#4A4A56"/><rect x="744" y="${b}" width="30" height="12" rx="3" fill="#4A4A56"/>`;
  }
  g += R(350, 120, 400, 420, 22, CARD, BORDER, 1.5, 'filter="url(#shadow)"') + R(360, 130, 380, 400, 16, '#1A1A20', '#4A4A56', 3);
  o += `<g transform="translate(550 330) scale(1.25) translate(-550 -330)">` + popG(550, 330, pp, g) + '</g>';
  const cores = [[385, 160], [555, 160], [385, 335], [555, 335]];
  const act = Math.floor(lt * 2.4) % 4;
  cores.forEach(([x, y], k) => {
    const p = eo((lt - 0.7 - 0.12 * k) / 0.35);
    const ph = frac(lt * 2.4), pulse = (k === act ? Math.sin(Math.PI * Math.min(1, ph * 1.15)) : 0) * (lt > 1.1 ? 1 : 0);
    let c = R(x, y, 160, 170, 14, '#22222A', mix('#4A4A56', OR, pulse), 3);
    c += `<rect x="${x}" y="${y}" width="160" height="170" rx="14" fill="${OR}" opacity="${f2(.55 * pulse)}" ${pulse > .4 ? 'filter="url(#glowS)"' : ''}/>`;
    for (let r = 0; r < 4; r++) c += `<rect x="${x + 22}" y="${y + 26 + r * 32}" width="${116 - r * 12}" height="10" rx="5" fill="${mix('#33333C', '#F5F5F7', pulse * .6)}"/>`;
    o += `<g transform="translate(550 330) scale(1.25) translate(-550 -330)">` + popG(x + 80, y + 85, p, c) + '</g>';
  });
  const lb = eo((lt - 1.0) / 0.3);
  o += T(550, 688, 'a few big, fast cores', { op: lb });
  return o;
}

// ---------- scene 6: transistor ----------
function s6(lt) {
  let o = '';
  const c = lt < 1.9 ? eo((lt - 0.9) / 0.3) : lt < 2.55 ? 1 - eo((lt - 1.9) / 0.3) : eo((lt - 2.55) / 0.3);
  const ap = eo((lt - 0.2) / 0.5);
  let g = `<path d="M 80 245 H 1020 V 590 Q 1020 610 1000 610 H 100 Q 80 610 80 590 Z" fill="#1B1B22" stroke="#3A3A44" stroke-width="3"/>`;
  g += R(140, 245, 260, 100, 4, 'rgba(77,163,255,.2)', BLUE, 3) + R(700, 245, 260, 100, 4, 'rgba(77,163,255,.2)', BLUE, 3);
  g += T(270, 312, 'n+', { fill: BLUE, mono: 1, size: 46 }) + T(830, 312, 'n+', { fill: BLUE, mono: 1, size: 46 });
  g += T(550, 520, 'p-type silicon', { fill: SEC, size: 46 });
  // channel
  g += `<rect x="400" y="245" width="300" height="34" fill="${OR}" opacity="${f2(.85 * c)}" ${c > .3 ? 'filter="url(#glowS)"' : ''}/>`;
  // oxide + gate
  g += R(360, 213, 380, 32, 4, 'rgba(245,245,247,.14)', '#8A8A94', 2);
  g += R(400, 148, 300, 65, 6, mix('#2A2A32', OR, c), mix('#6A6A76', '#F5B800', c), 3);
  for (let k = 0; k < 4; k++) g += T(445 + k * 70, 196, '+', { mono: 1, size: 46, fill: '#0E0E10', op: c });
  // contacts + wires
  g += R(200, 205, 120, 40, 4, '#3A3A44', '#8A8A94', 2) + R(780, 205, 120, 40, 4, '#3A3A44', '#8A8A94', 2);
  g += `<path d="M 260 205 V 140 M 840 205 V 140 M 550 148 V 140" stroke="#8A8A94" stroke-width="4" fill="none"/>`;
  // electrons
  if (c > .02) for (let k = 0; k < 8; k++) {
    const x = 170 + ((lt * 320 + k * 98) % 780), y = 262 + 6 * Math.sin(k * 2 + lt * 5);
    g += `<circle cx="${f2(x)}" cy="${f2(y)}" r="6.5" fill="${BLUE}" opacity="${f2(clamp(c * 1.3 - .3))}" filter="url(#glowS)"/>`;
  }
  o += `<g opacity="${f2(ap)}">${g}</g>`;
  const lb = eo((lt - 0.5) / 0.3);
  o += T(260, 118, 'Source', { op: lb }) + T(550, 118, 'Gate', { op: lb }) + T(840, 118, 'Drain', { op: lb });
  const on = c > .5;
  o += R(390, 660, 200, 80, 40, on ? OR : '#23232A', on ? OR : '#3A3A44', 3, on ? 'filter="url(#glowS)"' : '');
  o += T(490, 718, on ? 'ON' : 'OFF', { size: 52, w: 800, fill: on ? '#0E0E10' : SEC });
  o += T(630, 716, 'gate = ' + (on ? 1 : 0), { mono: 1, size: 46, anchor: 'start', fill: on ? OR : SEC });
  return o;
}

// ---------- scene 7: logic gate ----------
function s7(lt) {
  let o = '';
  const seq = [[0, 0], [0, 1], [1, 0], [1, 1], [1, 1]];
  const idx = lt < 0.5 ? 0 : clamp(Math.floor((lt - 0.5) / 0.62) + 0, 0, 4);
  const [A, B] = seq[idx], Y = (A && B) ? 0 : 1;
  const ap = eo((lt - 0.2) / 0.5);
  const col = v => v ? OR : '#4A4A56';
  const wire = (x1, x2, y, v) => `<rect x="${x1}" y="${y - 4.5}" width="${x2 - x1}" height="9" rx="4.5" fill="${col(v)}" ${v ? 'filter="url(#glowS)"' : ''}/>`;
  let g = wire(110, 380, 290, A) + wire(110, 380, 430, B) + wire(708, 960, 360, Y);
  g += `<path d="M 380 220 H 520 A 140 140 0 0 1 520 500 H 380 Z" fill="${CARD}" stroke="${TXT}" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)"/>`;
  g += `<circle cx="684" cy="360" r="24" fill="${BG}" stroke="${TXT}" stroke-width="5"/>`;
  g += T(500, 375, 'NAND', { mono: 1, size: 46, fill: SEC });
  g += T(60, 304, 'A', { size: 46, fill: SEC }) + T(60, 444, 'B', { size: 46, fill: SEC }) + T(1030, 376, 'Y', { size: 46, fill: SEC });
  g += T(245, 268, A, { mono: 1, size: 56, fill: A ? OR : DIM }) + T(245, 408, B, { mono: 1, size: 56, fill: B ? OR : DIM }) + T(835, 338, Y, { mono: 1, size: 56, fill: Y ? OR : DIM });
  o += `<g opacity="${f2(ap)}">${g}</g>`;
  const bp = eo((lt - 0.4) / 0.3);
  o += card(150, 585, 800, 130) + `<g opacity="${f2(bp)}">` +
    `<text x="550" y="670" font-family="JetBrains Mono" font-weight="700" font-size="62" text-anchor="middle" fill="${TXT}"><tspan fill="${A ? OR : DIM}">${A}</tspan> NAND <tspan fill="${B ? OR : DIM}">${B}</tspan> = <tspan fill="${Y ? OR : DIM}">${Y}</tspan></text></g>`;
  return o;
}

// ---------- scene 8: zeros and ones (full frame) ----------
function s8(lt) {
  const CW = 48, CH = 62, cols = Math.ceil(W / CW), rows = Math.ceil(H / CH);
  let o = '';
  const fin = eo((lt - 1.95) / 0.5);
  const cx = W / 2, cy = H / 2 + (VERT ? 20 : 0);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const id = r * 131 + c * 17;
    const appear = 0.1 + r * 0.045 + hash(id) * 0.5;
    if (lt < appear) continue;
    const flick = Math.floor(lt * (4 + 6 * hash(id + 1)) + hash(id + 2) * 9);
    const d = hash(id * 3 + flick) > .5 ? 1 : 0;
    const h2 = hash(id + 5);
    const dist = Math.hypot(c * CW + CW / 2 - cx, r * CH + CH / 2 - cy);
    const clear = fin * clamp(1 - dist / 420 + 0.15) ;
    let fill = '#3A3A44', op = .95;
    if (h2 > .93) { fill = OR; op = .75; } else if (h2 > .72) { fill = '#7A7A86'; }
    op *= clamp(eo((lt - appear) / 0.25)) * (1 - .88 * fin) * (1 - clear * .12);
    const sc = 1;
    o += `<text x="${c * CW + CW / 2}" y="${r * CH + 46}" font-family="JetBrains Mono" font-weight="700" font-size="46" text-anchor="middle" fill="${fill}" opacity="${f2(op)}">${d}</text>`;
  }
  // vignette/dark disc behind the hero 1
  o += `<defs><radialGradient id="vg"><stop offset="0" stop-color="${BG}" stop-opacity=".92"/><stop offset=".6" stop-color="${BG}" stop-opacity=".7"/><stop offset="1" stop-color="${BG}" stop-opacity="0"/></radialGradient></defs>`;
  o += `<circle cx="${cx}" cy="${cy}" r="${f2(540 * fin)}" fill="url(#vg)"/>`;
  if (fin > 0) {
    const s = .86 + .14 * fin;
    o += `<g opacity="${f2(fin)}" transform="translate(${cx} ${cy}) scale(${f2(s)}) translate(${-cx} ${-cy})"><text x="${cx}" y="${cy + 250}" font-family="JetBrains Mono" font-weight="700" font-size="${VERT ? 700 : 780}" text-anchor="middle" fill="${OR}" filter="url(#glow)">1</text></g>`;
  }
  return o;
}
const SCENES = [{ f: s1 }, { f: s2 }, { f: s3 }, { f: s4 }, { f: s5 }, { f: s6 }, { f: s7 }, { f: s8, full: 1 }];

// ---------- chip + gauge ----------
const meas = document.createElement('canvas').getContext('2d');
let CHIPW = [];
function chipSVG(i) {
  const L = LAYERS[i];
  const w = CHIPW[i], h = 76;
  return `<g transform="translate(${CHIP_X} ${CHIP_Y})">` + R(0, 0, w, h, 38, 'rgba(22,22,26,.96)', '#34343C', 2) +
    `<circle cx="38" cy="38" r="9" fill="${OR}"/>` +
    T(62, 52, '0' + (i + 1), { mono: 1, size: 40, fill: OR, anchor: 'start' }) + T(62 + 62, 53, L.name, { size: 44, w: 700, anchor: 'start' }) + '</g>';
}
function buildScene(i, lt) {
  const sc = SCENES[i];
  let inner;
  if (sc.full) inner = sc.f(lt);
  else inner = `<g transform="translate(${f2(OX)} ${f2(OY)}) scale(${S})">${sc.f(lt)}</g>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${inner}${chipSVG(i)}</svg>`;
}
const GY0 = VERT ? 400 : 246, GSP = VERT ? 78 : 84, GX = VERT ? 34 : 70;
function gaugeSVG(idx) {
  let o = '';
  if (!VERT) o += `<defs><linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="${BG}" stop-opacity=".94"/><stop offset=".72" stop-color="${BG}" stop-opacity=".86"/><stop offset="1" stop-color="${BG}" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="470" height="${H}" fill="url(#gp)"/>`;
  else o += `<defs><linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="${BG}" stop-opacity=".9"/><stop offset="1" stop-color="${BG}" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="90" height="${H}" fill="url(#gp)"/>`;
  const y1 = GY0 + 7 * GSP;
  o += `<line x1="${GX}" y1="${GY0}" x2="${GX}" y2="${y1}" stroke="#2F2F38" stroke-width="3"/>`;
  const yd = GY0 + idx * GSP;
  o += `<line x1="${GX}" y1="${GY0}" x2="${GX}" y2="${f2(yd)}" stroke="${OR}" stroke-width="3" opacity=".55"/>`;
  LAYERS.forEach((L, i) => {
    const y = GY0 + i * GSP, near = clamp(1 - Math.abs(idx - i));
    o += `<circle cx="${GX}" cy="${y}" r="${VERT ? 6 : 7}" fill="${i <= idx + .02 ? '#7A4A3A' : '#3A3A44'}"/>`;
    if (!VERT) o += T(GX + 40, y + 14, L.short, { size: 40, w: lerp(600, 800, near), anchor: 'start', fill: near > .5 ? TXT : DIM });
  });
  o += `<circle cx="${GX}" cy="${f2(yd)}" r="${VERT ? 13 : 15}" fill="${OR}" filter="url(#glow)"/>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}

// ---------- camera ----------
function camera(t) {
  let y = 0, speedPhase = 0;
  for (let k = 1; k < LAYERS.length; k++) {
    const p = clamp((t - LAYERS[k].start) / TRANS);
    y += eio(p);
    if (p > 0 && p < 1) speedPhase = Math.sin(Math.PI * p);
  }
  return { idx: y, speedPhase };
}
const worldEl = document.getElementById('world'), uiEl = document.getElementById('ui');
const sceneEls = LAYERS.map(() => { const d = document.createElement('div'); d.className = 'scene'; worldEl.appendChild(d); return d; });
window.renderAt = function (t) {
  const cam = camera(t);
  const camY = cam.idx * H;
  stage.style.backgroundPosition = '0px ' + (-camY) + 'px';
  sceneEls.forEach((el, i) => {
    const top = i * H - camY;
    if (Math.abs(top) >= H) { if (el.dataset.on === '1') { el.innerHTML = ''; el.dataset.on = '0'; } return; }
    el.dataset.on = '1';
    el.style.top = f2(top) + 'px';
    el.innerHTML = buildScene(i, Math.max(0, t - LAYERS[i].start));
  });
  const blur = cam.speedPhase > 0.02 ? 16 * Math.pow(cam.speedPhase, 2) : 0;
  document.getElementById('mbBlur').setAttribute('stdDeviation', '0 ' + f2(blur));
  worldEl.style.filter = blur > .3 ? 'url(#mb)' : 'none';
  uiEl.innerHTML = gaugeSVG(cam.idx);
};
window.ready = (async () => {
  await Promise.all(['400 40px Inter', '600 40px Inter', '700 44px Inter', '800 40px Inter', '500 40px "JetBrains Mono"', '700 40px "JetBrains Mono"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  meas.font = '700 44px Inter';
  CHIPW = LAYERS.map(L => 62 + 62 + meas.measureText(L.name).width + 34);
  window.renderAt(0);
  return true;
})();
</script></body></html>
