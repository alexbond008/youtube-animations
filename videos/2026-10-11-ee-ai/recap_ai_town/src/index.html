<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-Bold.ttf)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/Inter-ExtraBold.ttf)}
html,body{margin:0;padding:0;background:#0E0E10;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#0E0E10;
  background-image:radial-gradient(circle at 12px 12px,#23232A 1.2px,transparent 1.7px);background-size:24px 24px}
#stage canvas{position:absolute;left:0;top:0;display:block}
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const VERT = Q.get('mode') === 'vert';
const VW = VERT ? 1080 : 1920, H = VERT ? 1350 : 1080;
const stage = document.getElementById('stage');
stage.style.width = VW + 'px'; stage.style.height = H + 'px';
const cv = document.createElement('canvas'); cv.width = VW; cv.height = H; stage.appendChild(cv);
const ctx = cv.getContext('2d');
const BG = '#0E0E10', CARD = '#16161A', BORDER = '#2A2A30', TXT = '#F5F5F7', SEC = '#A1A1AA', OR = '#D97757', HOT = '#FF9A5C', BLUE = '#4DA3FF', RED = '#FF5A4E', GREEN = '#3DDC97';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixh = (a, b, t) => { t = clamp(t); const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
const fr = x => x - Math.floor(x);
const hs = n => fr(Math.sin(n * 127.1 + 311.7) * 43758.5453);
const rgba = (h, a) => { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

// ---------------- camera ----------------
// t, cx, cy, S, oxL, oyL, oxV, oyV, rest
const KF = [
  [0.0, 9.5, 8.0, 22, 0, 40, 0, 0, 1],
  [2.3, 9.5, 8.3, 45, 0, 70, 0, 0, 0],
  [5.5, 9.9, 8.0, 47, 0, 70, 0, 0, 0],
  [7.0, 3.7, 3.6, 98, 0, 90, 0, 60, 0],
  [8.0, 3.9, 3.6, 104, 0, 90, 0, 60, 0],
  [9.3, 6.9, 3.4, 68, 0, 40, 0, 40, 0],
  [10.0, 7.4, 3.8, 68, 0, 40, 0, 40, 0],
  [11.0, 8.8, 6.8, 78, 0, 60, 0, 120, 0],
  [12.0, 9.7, 9.2, 104, 0, 90, 0, 300, 0],
  [13.3, 10.0, 9.4, 114, -390, 60, 0, 420, 0],
  [15.3, 10.2, 9.5, 118, -390, 60, 0, 420, 0],
  [17.0, 9.5, 8.3, 45, 0, 70, 0, 0, 1],
];
const KT = KF.map(k => k[0]);
function tangents(p) {
  const n = KF.length, m = new Array(n).fill(0);
  for (let k = 1; k < n - 1; k++) {
    if (KF[k][8]) continue;
    const d0 = (KF[k][p] - KF[k - 1][p]) / (KT[k] - KT[k - 1]), d1 = (KF[k + 1][p] - KF[k][p]) / (KT[k + 1] - KT[k]);
    m[k] = d0 * d1 <= 0 ? 0 : 2 * d0 * d1 / (d0 + d1);
  }
  return m;
}
const TAN = {}; for (let p = 1; p <= 7; p++) TAN[p] = tangents(p);
function camVal(p, t) {
  t = clamp(t, 0, KT[KT.length - 1]);
  let k = 0; while (k < KT.length - 2 && t > KT[k + 1]) k++;
  const h = KT[k + 1] - KT[k], u = (t - KT[k]) / h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * KF[k][p] + (u3 - 2 * u2 + u) * h * TAN[p][k] + (-2 * u3 + 3 * u2) * KF[k + 1][p] + (u3 - u2) * h * TAN[p][k + 1];
}
let S = 40, CX = 9.5, CY = 8.5, SX0 = VW / 2, SY0 = H / 2, ZS = 32, VZ = 1;
const A = 0.866, B = 0.5;
const px = (x, y, z = 0) => [SX0 + ((x - CX) - (y - CY)) * A * S, SY0 + ((x - CX) + (y - CY)) * B * S - z * VZ * ZS];

// ---------------- drawing helpers ----------------
function poly(P, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i][0], P[i][1]); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.lineJoin = 'round'; ctx.stroke(); }
}
const ew = () => Math.max(1.2, S * 0.032);
const PAL = { base: { t: '#434350', l: '#2A2A34', r: '#363642' }, lt: { t: '#4E4E5C', l: '#2E2E39', r: '#3C3C4A' }, dk: { t: '#2A2A33', l: '#1A1A20', r: '#212128' }, glass: { t: '#38455A', l: '#212A3A', r: '#2B3750' } };
function box(b, pal, lit = 0, o = {}) {
  const { x, y, w, d, h } = b, z0 = b.z0 || 0, z1 = z0 + h, x1 = x + w, y1 = y + d;
  const tc = mixh(pal.t, '#7A4430', lit * .6), lc = mixh(pal.l, '#4A2618', lit * .5), rc = mixh(pal.r, '#5E321F', lit * .5);
  if (h > 0.4 && o.shadow !== false) {
    const sx = h * 0.45, sy = h * 0.2;
    poly([px(x, y1, 0), px(x1, y1, 0), px(x1 + sx, y1 + sy, 0), px(x1 + sx, y + sy, 0), px(x1, y, 0), px(x1, y1, 0)], 'rgba(0,0,0,.28)');
  }
  let P = [px(x1, y, z0), px(x1, y1, z0), px(x1, y1, z1), px(x1, y, z1)];
  let g = ctx.createLinearGradient(0, P[0][1], 0, P[3][1]); g.addColorStop(0, mixh(rc, '#000000', .35)); g.addColorStop(1, rc); poly(P, g);
  P = [px(x, y1, z0), px(x1, y1, z0), px(x1, y1, z1), px(x, y1, z1)];
  g = ctx.createLinearGradient(0, P[0][1], 0, P[3][1]); g.addColorStop(0, mixh(lc, '#000000', .35)); g.addColorStop(1, lc); poly(P, g);
  const T = [px(x, y, z1), px(x1, y, z1), px(x1, y1, z1), px(x, y1, z1)];
  poly(T, tc);
  const ec = mixh(o.edge || '#3C3C48', OR, lit * .95);
  ctx.strokeStyle = ec; ctx.lineWidth = ew(); ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...px(x, y1, z1)); ctx.lineTo(...px(x1, y1, z1)); ctx.lineTo(...px(x1, y, z1)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...px(x1, y1, z0)); ctx.lineTo(...px(x1, y1, z1)); ctx.globalAlpha *= .6; ctx.stroke(); ctx.globalAlpha /= .6;
  ctx.beginPath(); ctx.moveTo(...px(x, y, z1)); ctx.lineTo(...px(x1, y, z1)); ctx.globalAlpha *= .5; ctx.stroke(); ctx.globalAlpha /= .5;
}
function fp(b, face, u, v) { // face point, u,v in 0..1
  const z = (b.z0 || 0) + v * b.h;
  if (face === 'r') return px(b.x + b.w, b.y + u * b.d, z);
  if (face === 'l') return px(b.x + u * b.w, b.y + b.d, z);
  return px(b.x + u * b.w, b.y + v * b.d, (b.z0 || 0) + b.h); // top: v along y
}
function fq(b, face, u0, u1, v0, v1, fill, stroke) { poly([fp(b, face, u0, v0), fp(b, face, u1, v0), fp(b, face, u1, v1), fp(b, face, u0, v1)], fill, stroke, 1); }
function windows(b, face, cols, rows, mx, my, lit, seed, on = '#FFB27A', off = '#1F242D', t = 0) {
  const cw = (1 - 2 * mx) / cols, rh = (1 - 2 * my) / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const hv = hs(seed + i * 7.3 + j * 13.1);
    const isOn = hv < lit * .8 + .06 && !(hv > .96 && fr(t * .7 + hv * 9) > .5 ? false : false);
    const col = isOn ? mixh(off, on, clamp(.35 + lit * .75 + (hs(seed + i * 3 + j + Math.floor(t * 1.5)) - .5) * .25)) : off;
    fq(b, face, mx + i * cw + cw * .12, mx + (i + 1) * cw - cw * .12, my + j * rh + rh * .16, my + (j + 1) * rh - rh * .16, col);
  }
}
function glowE(x, y, z, r, col, a) { // iso ground ellipse glow, r in world units
  if (a <= .005) return;
  const [sx, sy] = px(x, y, z), rx = r * 1.2247 * S, ry = r * .7071 * S;
  ctx.save(); ctx.translate(sx, sy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(.45, rgba(col, a * .38)); g.addColorStop(1, rgba(col, 0));
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function glowS(sx, sy, r, col, a) {
  if (a <= .005) return;
  const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(.4, rgba(col, a * .35)); g.addColorStop(1, rgba(col, 0));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function ellipseAt(x, y, z, r) { const [sx, sy] = px(x, y, z); return [sx, sy, r * 1.2247 * S, r * .7071 * S]; }
function cyl(x, y, r, z0, h, col, lit = 0, topCol) {
  const [bx, by, rx, ry] = ellipseAt(x, y, z0, r), ht = h * VZ * ZS;
  const c = mixh(col, '#6A3A28', lit * .5);
  const g = ctx.createLinearGradient(bx - rx, 0, bx + rx, 0); g.addColorStop(0, mixh(c, '#000000', .35)); g.addColorStop(.45, mixh(c, '#ffffff', .12)); g.addColorStop(1, mixh(c, '#000000', .55));
  ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, Math.PI); ctx.lineTo(bx - rx, by - ht); ctx.lineTo(bx + rx, by - ht); ctx.closePath();
  ctx.moveTo(bx + rx, by); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(bx - rx, by); ctx.lineTo(bx - rx, by - ht); ctx.lineTo(bx + rx, by - ht); ctx.lineTo(bx + rx, by); ctx.ellipse(bx, by, rx, ry, 0, 0, Math.PI); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx, by - ht, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = topCol || mixh(c, '#ffffff', .1); ctx.fill();
  ctx.strokeStyle = mixh('#3C3C48', OR, lit * .95); ctx.lineWidth = ew(); ctx.stroke();
}

// ---------------- world ----------------
const PLATE = [-1.8, -1.8, 20.6, 19.6];
const RX = [0.4, 6.4, 12.4, 18.9], RY = [0.4, 6.2, 12.3, 17.3];
const LOTS = {
  R: [1.2, 1.2, 4.6, 4.6], M: [7.2, 1.2, 4.6, 4.4], V: [13.2, 1.2, 4.8, 4.4],
  C: [1.2, 7.0, 4.6, 4.6], F: [7.2, 7.0, 4.8, 4.8], D: [13.2, 7.0, 4.8, 4.8],
  P: [6.6, 13.6, 8.6, 3.0],
};
const NAMES = { R: 'AI Research', M: 'Maths', V: 'Voice AI & products', C: 'Control = RL', F: 'Hardware: GPU factory', D: 'Data centres', P: 'Power plant' };
const ORDER = ['R', 'M', 'V', 'C', 'F', 'D', 'P'];
const ANCH = { R: [3.6, 3.4, 4.9], M: [9.5, 3.6, 5.2], V: [15.6, 2.6, 5.7], C: [3.5, 9.2, 6.9], F: [9.6, 8.9, 3.7], D: [15.6, 9.2, 2.2], P: [9.3, 15.3, 1.5] };
const ENERGY = t => sm((t - 15.0) / 1.2);
const ALLON = t => sm((t - 15.3) / 1.0);
const bump = (t, a, up, b, down, floor) => Math.max(floor, sm((t - a) / up) * (1 - (1 - floor) * sm((t - b) / down)));
function LIT(id, t) {
  const base = .22 + .1 * sm(t / 4), all = ALLON(t) * .95;
  let v;
  if (id === 'R') v = bump(t, 5.5, .8, 8.2, 1.0, base);
  else if (id === 'M') v = bump(t, 8.9, .7, 10.4, 1.0, base);
  else if (id === 'F') v = bump(t, 10.9, 1.0, 99, 1, base);
  else if (id === 'P') v = Math.max(base + .1, ENERGY(t));
  else v = base;
  return Math.max(v, all);
}
const FOC = (id, t) => id === 'R' ? sm((t - 5.7) / .6) * (1 - sm((t - 8.0) / .6)) : id === 'M' ? sm((t - 8.9) / .6) * (1 - sm((t - 10.2) / .6)) : id === 'F' ? sm((t - 11.4) / .8) * (1 - sm((t - 15.4) / .6)) : 0;

function drawGround(t) {
  const [x0, y0, x1, y1] = PLATE, th = .5;
  // slab sides
  poly([px(x1, y0, 0), px(x1, y1, 0), px(x1, y1, -th), px(x1, y0, -th)], '#0B0B0E', '#26262C', 1);
  poly([px(x0, y1, 0), px(x1, y1, 0), px(x1, y1, -th), px(x0, y1, -th)], '#09090B', '#26262C', 1);
  poly([px(x0, y0, 0), px(x1, y0, 0), px(x1, y1, 0), px(x0, y1, 0)], '#18181E', '#34343E', 1.5);
  // tile grid
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.ceil(x0); x <= x1; x++) { ctx.moveTo(...px(x, y0, 0)); ctx.lineTo(...px(x, y1, 0)); }
  for (let y = Math.ceil(y0); y <= y1; y++) { ctx.moveTo(...px(x0, y, 0)); ctx.lineTo(...px(x1, y, 0)); }
  ctx.stroke();
  // roads beyond plate (faint)
  const ext = 26;
  for (const X of RX) for (const s of [-1, 1]) {
    const a = s < 0 ? y0 : y1, b = s < 0 ? y0 - ext : y1 + ext;
    const p = px(X, a, 0), q = px(X, b, 0), g = ctx.createLinearGradient(p[0], p[1], q[0], q[1]);
    g.addColorStop(0, 'rgba(60,60,72,.55)'); g.addColorStop(1, 'rgba(60,60,72,0)');
    ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, S * .5); ctx.setLineDash([S * .5, S * .5]); ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke();
  }
  for (const Y of RY) for (const s of [-1, 1]) {
    const a = s < 0 ? x0 : x1, b = s < 0 ? x0 - ext : x1 + ext;
    const p = px(a, Y, 0), q = px(b, Y, 0), g = ctx.createLinearGradient(p[0], p[1], q[0], q[1]);
    g.addColorStop(0, 'rgba(60,60,72,.55)'); g.addColorStop(1, 'rgba(60,60,72,0)');
    ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, S * .5); ctx.setLineDash([S * .5, S * .5]); ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke();
  }
  ctx.setLineDash([]);
  // roads
  const rw = .36;
  for (const X of RX) poly([px(X - rw, y0, 0), px(X + rw, y0, 0), px(X + rw, y1, 0), px(X - rw, y1, 0)], '#0A0A0D');
  for (const Y of RY) poly([px(x0, Y - rw, 0), px(x1, Y - rw, 0), px(x1, Y + rw, 0), px(x0, Y + rw, 0)], '#0A0A0D');
  ctx.strokeStyle = '#2A2A32'; ctx.lineWidth = Math.max(1, S * .02); ctx.setLineDash([S * .3, S * .3]);
  ctx.beginPath();
  for (const X of RX) { ctx.moveTo(...px(X, y0, 0)); ctx.lineTo(...px(X, y1, 0)); }
  for (const Y of RY) { ctx.moveTo(...px(x0, Y, 0)); ctx.lineTo(...px(x1, Y, 0)); }
  ctx.stroke(); ctx.setLineDash([]);
  // lots
  for (const id of ORDER) {
    const [x, y, w, d] = LOTS[id], lit = LIT(id, t);
    box({ x, y, w, d, h: .1 }, { t: '#22222B', l: '#14141A', r: '#1A1A21' }, lit * .25, { shadow: false, edge: '#32323C' });
    // lot rim glow
    ctx.strokeStyle = rgba(OR, .08 + lit * .55); ctx.lineWidth = Math.max(1.5, S * .035);
    ctx.beginPath(); ctx.moveTo(...px(x + .12, y + .12, .1)); ctx.lineTo(...px(x + w - .12, y + .12, .1)); ctx.lineTo(...px(x + w - .12, y + d - .12, .1)); ctx.lineTo(...px(x + .12, y + d - .12, .1)); ctx.closePath(); ctx.stroke();
  }
  // glow pools
  for (const id of ORDER) { const [x, y, w, d] = LOTS[id]; glowE(x + w / 2, y + d / 2, .1, Math.max(w, d) * .62, OR, LIT(id, t) * .5); }
  // road intersection lamps
  for (const X of RX) for (const Y of RY) { const [sx, sy] = px(X, Y, .1); ctx.fillStyle = '#4A4A56'; ctx.beginPath(); ctx.ellipse(sx, sy, S * .1, S * .06, 0, 0, 7); ctx.fill(); }
}

// ---- other towns ----
function drawOthers(t) {
  const [x0, y0, x1, y1] = PLATE;
  ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
  const pitch = 3.6;
  for (let i = -8; i <= 14; i++) for (let j = -7; j <= 13; j++) {
    const gx = i * pitch + 1.3, gy = j * pitch + 1.0;
    if (gx > x0 - 2.2 && gx < x1 + .6 && gy > y0 - 2.2 && gy < y1 + .6) continue;
    const id = i * 31 + j * 17; if (hs(id) < .38) continue;
    const w = 1.2 + hs(id + 1) * 1.4, d = 1.2 + hs(id + 2) * 1.4, h = .4 + Math.pow(hs(id + 3), 1.6) * 3.2;
    const dist = Math.hypot(gx - 9.5, (gy - 9) * 1.1);
    const al = clamp(1 - (dist - 14) / 30) * .55 * eo(t / 1.5);
    if (al < .02) continue;
    const c = px(gx + w / 2, gy + d / 2, 0); if (c[0] < -250 || c[0] > VW + 250 || c[1] < -350 || c[1] > H + 250) continue;
    ctx.globalAlpha = al;
    const top = [px(gx, gy, h), px(gx + w, gy, h), px(gx + w, gy + d, h), px(gx, gy + d, h)];
    poly([px(gx + w, gy, 0), px(gx + w, gy + d, 0), top[2], top[1]], 'rgba(22,22,28,.8)');
    poly([px(gx, gy + d, 0), px(gx + w, gy + d, 0), top[2], top[3]], 'rgba(17,17,22,.8)');
    poly(top, 'rgba(30,30,38,.8)', '#34343E', 1.2);
    ctx.strokeStyle = '#34343E'; ctx.beginPath(); ctx.moveTo(...top[2]); ctx.lineTo(...px(gx + w, gy + d, 0)); ctx.moveTo(...top[1]); ctx.lineTo(...px(gx + w, gy, 0)); ctx.moveTo(...top[3]); ctx.lineTo(...px(gx, gy + d, 0)); ctx.stroke();
    if (hs(id + 5) > .8) { ctx.fillStyle = rgba(OR, .5); const q = px(gx + w / 2, gy + d / 2, h); ctx.beginPath(); ctx.arc(q[0], q[1] - 3, Math.max(2, S * .05), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

// ---- buildings ----
function bResearch(t) {
  const lit = LIT('R', t);
  box({ x: 1.9, y: 4.0, w: 1.5, d: 1.5, h: .9 }, PAL.base, lit);
  windows({ x: 1.9, y: 4.0, w: 1.5, d: 1.5, h: .9 }, 'l', 3, 2, .1, .15, lit, 11, '#FFB27A', '#1F242D', t);
  windows({ x: 1.9, y: 4.0, w: 1.5, d: 1.5, h: .9 }, 'r', 3, 2, .1, .15, lit, 17, '#FFB27A', '#1F242D', t);
  box({ x: 4.2, y: 2.0, w: 1.3, d: 2.0, h: .75 }, PAL.base, lit);
  windows({ x: 4.2, y: 2.0, w: 1.3, d: 2.0, h: .75 }, 'r', 4, 2, .1, .15, lit, 23, '#FFB27A', '#1F242D', t);
  box({ x: 3.7, y: 4.4, w: 1.8, d: 1.1, h: .6 }, PAL.lt, lit);
  // dome
  const cx = 3.3, cy = 3.2, r = 1.1;
  cyl(cx, cy, r, .1, .6, '#383844', lit);
  const [bx, by, rx, ry] = ellipseAt(cx, cy, .7, r), hh = r * ZS * VZ * 1.25;
