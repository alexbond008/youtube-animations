<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0;padding:0;background:#0E0E10;overflow:hidden}
#stage{position:relative;overflow:hidden;width:1920px;height:1080px;background:#0E0E10;
  background-image:radial-gradient(circle at 12px 12px,#23232A 1.2px,transparent 1.7px);background-size:24px 24px}
#stage svg{position:absolute;left:0;top:0;display:block}
</style></head>
<body>
<div id="stage"></div>
<script>
const SCENE = new URLSearchParams(location.search).get('scene') || 'calendar';
const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const BG = '#0E0E10', CARD = '#16161A', BORDER = '#2A2A30', TXT = '#F5F5F7', SEC = '#A1A1AA', OR = '#D97757', RED = '#FF5A4E', GREEN = '#3DDC97', AMBER = '#F5B800', NODE = '#1C1C21';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const f2 = x => (+x).toFixed(2);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const rv = (t, s, d) => eo((t - s) / d);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t))).toString(16).padStart(2, '0')).join(''); };
const meas = document.createElement('canvas').getContext('2d');
const mw = (s, font) => { meas.font = font; return meas.measureText(s).width; };
const SH = `filter="drop-shadow(0 20px 60px rgba(0,0,0,.55))"`;
const pop = (p, cx, cy, inner) => `<g opacity="${f2(p)}" transform="translate(${f2(cx)} ${f2(cy)}) scale(${f2(lerp(.92, 1, p))}) translate(${f2(-cx)} ${f2(-cy)})">${inner}</g>`;
const T = (x, y, s, o = {}) => `<text x="${f2(x)}" y="${f2(y)}" font-family="${o.mono ? "'JetBrains Mono'" : 'Inter'}" font-size="${o.size || 34}" font-weight="${o.w || 600}" fill="${o.fill || TXT}" text-anchor="${o.anchor || 'start'}" opacity="${o.op == null ? 1 : f2(o.op)}">${esc(s)}</text>`;
function chip(x, y, label, color, p, dotColor) {
  const w = 28 + 18 + 16 + mw(label, '700 34px Inter') + 28, h = 72;
  return pop(p, x, y, `<g ${SH}><rect x="${x}" y="${y - h / 2}" width="${f2(w)}" height="${h}" rx="16" fill="${CARD}" stroke="${BORDER}"/></g>
    <circle cx="${x + 28 + 9}" cy="${y}" r="9" fill="${dotColor || color}"/>${T(x + 28 + 18 + 16, y + 12, label, { w: 700, fill: color })}`);
}

// ======================= (a) CALENDAR =======================
const CX0 = 180, CY0 = 140, CW = 820, CH = 800;
const GX = 220, GY = 330, CELLW = 108, CELLH = 112;
const cell = d => { const i = d - 1; return [GX + (i % 7) * CELLW, GY + Math.floor(i / 7) * CELLH]; };
function halls(x, y, t, p) {
  // dimmed building, empty dark windows
  const w = 250, h = 300, x0 = x - w / 2, y0 = y - h;
  let g = `<path d="M ${x0 - 14} ${y0 + 6} L ${x} ${y0 - 46} L ${x0 + w + 14} ${y0 + 6}" fill="none" stroke="#4A4A54" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="8" fill="#1C1C21" stroke="#3A3A42" stroke-width="3"/>`;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
    if (r === 3 && c === 1) continue;
    g += `<rect x="${x0 + 30 + c * 72}" y="${y0 + 28 + r * 64}" width="46" height="40" rx="4" fill="#0B0B0D" stroke="#34343C" stroke-width="2"/>`;
  }
  g += `<rect x="${x - 26}" y="${y - 74}" width="52" height="74" rx="4" fill="#0B0B0D" stroke="#3A3A42" stroke-width="3"/>`;
  g += `<line x1="${x - 170}" x2="${x + 170}" y1="${y}" y2="${y}" stroke="#3A3A42" stroke-width="3" stroke-linecap="round"/>`;
  return pop(p, x, y - 150, `<g opacity="0.62">${g}</g>${T(x, y + 64, 'Halls · nobody here yet', { size: 34, w: 600, fill: SEC, anchor: 'middle' })}`);
}
function sceneCalendar(t) {
  let g = '';
  const pc = rv(t, 0, 0.35);
  let card = `<g ${SH}><rect x="${CX0}" y="${CY0}" width="${CW}" height="${CH}" rx="16" fill="${CARD}" stroke="${BORDER}"/></g>`;
  card += T(GX + 6, 235, 'September', { size: 48, w: 800 });
  'MTWTFSS'.split('').forEach((d, i) => card += T(GX + i * CELLW + 51, 300, d, { size: 28, w: 600, fill: SEC, anchor: 'middle' }));
  const ap = eio((t - 0.6) / 0.7); // arrow sweep progress 28 -> 14
  for (let d = 1; d <= 30; d++) {
    const [x, y] = cell(d);
    let fill = '#1B1B20', stroke = 'none', tc = SEC, sw = 0;
    if (d >= 14 && d <= 27) { const k = (27 - d) / 13; const a = clamp((ap - 0.05 - k * 0.85) / 0.12); fill = mix('#1B1B20', '#3A2620', a); tc = mix(SEC, TXT, a * 0.6); }
    if (d === 28) { fill = mix('#1B1B20', '#2A2A30', rv(t, 0.15, 0.3)); stroke = TXT; sw = 3 * rv(t, 0.15, 0.3); tc = TXT; }
    if (d === 14) { const q = rv(t, 1.15, 0.3); fill = mix(fill, '#4A2C22', q); stroke = OR; sw = 3.5 * q; tc = mix(tc, TXT, q); }
    card += `<rect x="${x + 3}" y="${y + 3}" width="${CELLW - 6}" height="${CELLH - 6}" rx="12" fill="${fill}" ${sw > 0 ? `stroke="${stroke}" stroke-width="${f2(sw)}"` : ''}/>`;
    card += T(x + 20, y + 44, String(d), { size: 30, w: 700, fill: tc });
  }
  g += pop(pc, CX0 + CW / 2, CY0 + CH / 2, card);
  // arrow 28 -> 14 bulging right of the card
  const [x28, y28] = cell(28), [x14, y14] = cell(14);
  const sx = x28 + CELLW - 4, sy = y28 + CELLH / 2, ex = x14 + CELLW + 4, ey = y14 + CELLH / 2;
  const c1x = 1100, path = `M ${sx} ${sy} C ${c1x} ${sy}, ${c1x} ${ey}, ${ex + 16} ${ey}`;
  if (ap > 0) {
    const flow = (t * 0.12) % 1;
    g += `<path d="${path}" fill="none" stroke="${OR}" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="${f2(ap)} 2"/>`;
    if (t > 1.4) g += `<path d="${path}" fill="none" stroke="#FFD2BF" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="0.04 0.16" stroke-dashoffset="${f2(-flow)}" opacity="${f2(0.5 * rv(t, 1.4, 0.4))}"/>`;
    const ah = rv(t, 1.18, 0.12);
    g += `<path d="M ${ex + 34} ${ey - 18} L ${ex + 8} ${ey} L ${ex + 34} ${ey + 18}" fill="none" stroke="${OR}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="${f2(ah)}"/>`;
  }
  g += pop(rv(t, 0.9, 0.3), 1110, (sy + ey) / 2, T(1110, (sy + ey) / 2 + 14, '−14 days', { size: 40, w: 800, fill: OR }));
  g += chip(1110, y28 + CELLH / 2 + 74, 'Term starts', TXT, rv(t, 0.15, 0.35));
  g += chip(1110, y14 + CELLH / 2 - 76, 'Back to halls', OR, rv(t, 1.15, 0.35));
  g += halls(1585, 700, t, rv(t, 1.5, 0.4));
  const z = 1; // static framing (no camera push)
  return `<g transform="translate(960 540) scale(${f2(z)}) translate(-960 -540)">${g}</g>`;
}

// ======================= (b) LOOP =======================
const LC = [860, 565], R = 240, NR = 76;
const NODES = [{ k: 'eat', label: 'Eat' }, { k: 'gym', label: 'Gym' }, { k: 'sleep', label: 'Sleep' }, { k: 'study', label: 'Study' }];
const ang = k => (-90 + 90 * k) * Math.PI / 180;
const npos = k => [LC[0] + R * Math.cos(ang(k)), LC[1] + R * Math.sin(ang(k))];
const WORDS = [2.85, 3.4, 4.25, 5.45];
function P(t) {
  if (t < WORDS[0]) return null;
  let p = 0; for (let k = 1; k < 4; k++) p += eio((t - WORDS[k]) / 0.18);
  if (t < 7.0) return p + 25 * eio((t - 5.6) / 1.4); // Day 1 -> Day 7, 6 fast cycles
  // slow continuing loop; slower after 16.7
  const a = Math.min(t, 16.7) - 7.0, b = Math.max(0, t - 16.7);
  return 28 + a * 0.9 + b * 0.55;
}
function dayAt(t) {
  const p = P(t);
  if (p == null || t < 5.6) return 1;
  return Math.min(7, 1 + Math.floor((p - 3 + 0.001) / 4));
}
function icon(k, c, bg) {
  const s = `stroke="${c}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  if (k === 'eat') return `<path d="M -16 -26 L -16 -8 Q -16 0 -8 0 Q 0 0 0 -8 L 0 -26 M -8 -26 L -8 28" ${s}/><path d="M 18 28 L 18 -26 Q 30 -16 29 4 L 18 6" ${s}/>`;
  if (k === 'gym') return `<line x1="-18" y1="0" x2="18" y2="0" ${s}/><rect x="-30" y="-17" width="11" height="34" rx="3" fill="${c}"/><rect x="19" y="-17" width="11" height="34" rx="3" fill="${c}"/><rect x="-39" y="-10" width="8" height="20" rx="2.5" fill="${c}"/><rect x="31" y="-10" width="8" height="20" rx="2.5" fill="${c}"/>`;
  if (k === 'sleep') return `<circle cx="-3" cy="2" r="26" fill="${c}"/><circle cx="10" cy="-9" r="22" fill="${bg}"/><path d="M 20 -28 L 30 -28 L 20 -18 L 30 -18" stroke="${c}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  if (k === 'study') return `<path d="M 0 -14 Q -14 -24 -32 -20 L -32 20 Q -14 16 0 26 Q 14 16 32 20 L 32 -20 Q 14 -24 0 -14 Z M 0 -14 L 0 26" ${s}/>`;
}
function node(k, t, inten, appear) {
  const [x, y] = npos(k), n = NODES[k];
  const bg = mix(NODE, '#3A2620', inten), stroke = mix('#34343C', OR, inten), ic = mix('#8A8A94', TXT, Math.max(inten, 0.0));
  const s = lerp(1, 1.07, inten);
  let g = `<g transform="translate(${f2(x)} ${f2(y)}) scale(${f2(s)})">`;
  if (inten > 0.05) g += `<circle r="${NR + 10}" fill="${OR}" opacity="${f2(0.12 * inten)}"/>`;
  g += `<circle r="${NR}" fill="${bg}" stroke="${stroke}" stroke-width="${f2(3 + 2 * inten)}"/>${icon(n.k, ic, bg)}</g>`;
  const L = [[x, y - NR - 26, 'middle'], [x + NR + 24, y + 12, 'start'], [x, y + NR + 50, 'middle'], [x - NR - 24, y + 12, 'end']][k];
  g += T(L[0], L[1], n.label, { size: 34, w: 700, fill: mix(SEC, TXT, inten), anchor: L[2] });
  return pop(appear, x, y, g);
}
function ring(t, appear) {
  let g = '';
  const gap = Math.asin((NR + 18) / R);
  for (let k = 0; k < 4; k++) {
    const a1 = ang(k) + gap, a2 = ang(k + 1) - gap;
    const p1 = [LC[0] + R * Math.cos(a1), LC[1] + R * Math.sin(a1)], p2 = [LC[0] + R * Math.cos(a2), LC[1] + R * Math.sin(a2)];
    g += `<path d="M ${f2(p1[0])} ${f2(p1[1])} A ${R} ${R} 0 0 1 ${f2(p2[0])} ${f2(p2[1])}" fill="none" stroke="#3A3A42" stroke-width="4" stroke-linecap="round"/>`;
    // arrowhead tangent at a2 (clockwise)
    const tx = -Math.sin(a2), ty = Math.cos(a2), nx = Math.cos(a2), ny = Math.sin(a2);
    const b = [p2[0] - tx * 16, p2[1] - ty * 16];
    g += `<path d="M ${f2(b[0] + nx * 10)} ${f2(b[1] + ny * 10)} L ${f2(p2[0])} ${f2(p2[1])} L ${f2(b[0] - nx * 10)} ${f2(b[1] - ny * 10)}" fill="none" stroke="#3A3A42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<g opacity="${f2(appear)}">${g}</g>`;
}
function comet(t) {
  const p = P(t);
  if (p == null) return '';
  const v = (P(t + 0.02) - P(Math.max(WORDS[0], t - 0.02))) / 0.04; // steps/s
  const trail = clamp(v * 0.09, 0.02, 1.4); // in steps
  const a = ang(p), at = ang(p - trail);
  const pt = [LC[0] + R * Math.cos(a), LC[1] + R * Math.sin(a)], pt0 = [LC[0] + R * Math.cos(at), LC[1] + R * Math.sin(at)];
  const large = (a - at) > Math.PI ? 1 : 0;
  const op = rv(t, WORDS[0], 0.2);
  return `<g opacity="${f2(op)}"><path d="M ${f2(pt0[0])} ${f2(pt0[1])} A ${R} ${R} 0 ${large} 1 ${f2(pt[0])} ${f2(pt[1])}" fill="none" stroke="${OR}" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <circle cx="${f2(pt[0])}" cy="${f2(pt[1])}" r="10" fill="${OR}"/><circle cx="${f2(pt[0])}" cy="${f2(pt[1])}" r="20" fill="${OR}" opacity="0.18"/></g>`;
}
function intensities(t) {
  const p = P(t);
  if (p == null) return [0, 0, 0, 0];
  const out = [0, 0, 0, 0];
  for (let k = 0; k < 4; k++) {
    let d = ((p - k) % 4 + 4) % 4; if (d > 2) d -= 4; // signed wrap distance
    out[k] = Math.pow(clamp(1 - Math.abs(d) / 0.85), 1.4);
  }
  const fadeIn = rv(t, WORDS[0], 0.15);
  const late = lerp(1, 0.7, clamp((t - 7.2) / 1.5)); // the loop goes on, quieter
  return out.map(v => v * fadeIn * late);
}
function convChip(t) {
  const p = rv(t, 0.8, 0.35), x = 350, y = 190;
  const f1 = '600 34px Inter', l = 'Conversations: ', w = 28 + 44 + 14 + mw(l, f1) + mw('0', '800 34px Inter') + 30, h = 72;
  // speech bubble icon
  const bub = `<g transform="translate(${x + 28 + 22} ${y})"><path d="M -20 -14 Q -20 -20 -14 -20 L 14 -20 Q 20 -20 20 -14 L 20 6 Q 20 12 14 12 L -4 12 L -14 21 L -12 12 L -14 12 Q -20 12 -20 6 Z" fill="none" stroke="${SEC}" stroke-width="3.5" stroke-linejoin="round"/></g>`;
  return pop(p, x, y, `<rect x="${x}" y="${y - h / 2}" width="${f2(w)}" height="${h}" rx="16" fill="#1B1B20" stroke="${BORDER}"/>${bub}
    <text x="${x + 28 + 44 + 14}" y="${y + 12}" font-family="Inter" font-size="34"><tspan font-weight="600" fill="${SEC}">${l}</tspan><tspan font-weight="800" fill="${TXT}">0</tspan></text>`);
}
function mood(t) {
  const p = rv(t, 6.6, 0.4);
  if (p <= 0) return '';
  const x = 1430, y0 = 330, h = 470, w = 52;
  let L = 1 - 0.88 * eio((t - 7.0) / 5.2);
  if (t > 12.2) L += 0.012 * Math.sin((t - 12.2) * 3.1);
  const c = L > 0.55 ? mix(GREEN, AMBER, (1 - L) / 0.45) : mix(AMBER, RED, (0.55 - L) / 0.43);
  const fh = h * L;
  const lowPulse = t > 12.2 ? 0.5 + 0.5 * Math.sin((t - 12.2) * 2.6) : 0;
  let g = T(x + w / 2, y0 - 30, 'Mood', { size: 34, w: 700, anchor: 'middle' });
  g += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="${w / 2}" fill="#1B1B20" stroke="${BORDER}" stroke-width="2"/>`;
  g += `<clipPath id="mc"><rect x="${x}" y="${y0}" width="${w}" height="${h}" rx="${w / 2}"/></clipPath>`;
  g += `<rect clip-path="url(#mc)" x="${x}" y="${f2(y0 + h - fh)}" width="${w}" height="${f2(fh)}" fill="${c}"/>`;
  if (t > 12.2) g += `<rect x="${x - 6}" y="${y0 + h - 70}" width="${w + 12}" height="76" rx="${(w + 12) / 2}" fill="none" stroke="${RED}" stroke-width="3" opacity="${f2(0.15 + 0.35 * lowPulse * rv(t, 12.2, 0.4))}"/>`;
  // ticks
  for (let i = 1; i < 4; i++) g += `<line x1="${x + w + 10}" x2="${x + w + 22}" y1="${y0 + h * i / 4}" y2="${y0 + h * i / 4}" stroke="#3A3A42" stroke-width="3" stroke-linecap="round"/>`;
  return pop(p, x + w / 2, y0 + h / 2, g);
}
function dayCounter(t) {
  const p = rv(t, 1.8, 0.35);
  if (p <= 0) return '';
  const d = dayAt(t);
  // bump on each tick during fast phase
  let bump = 0;
  if (t >= 5.6 && t <= 7.3) { const pp = P(t); const frac = ((pp - 3) / 4) % 1; bump = d < 7 || t < 7.05 ? Math.max(0, 1 - frac * 5) * 0.06 : 0; }
  const out = rv(t, 19.8, 0.22);
  const s = 1 + bump;
  return `<g opacity="${f2(p * (1 - out))}" transform="translate(${LC[0]} ${LC[1] - out * 30}) scale(${f2(s)})">
    ${T(0, -58 + 0, 'Day', { size: 30, w: 600, fill: SEC, anchor: 'middle' })}
    ${T(0, 26, String(d), { size: 96, w: 800, anchor: 'middle' })}
    ${T(0, 70, 'of 7', { size: 28, w: 600, fill: SEC, anchor: 'middle', op: rv(t, 5.6, 0.3) })}</g>`;
}
function day30(t) {
  const p = rv(t, 19.85, 0.3);
  if (p <= 0) return '';
  const pulse = 0.5 + 0.5 * Math.sin((t - 20.1) * 3.4);
  const s = lerp(0.92, 1, p) * (1 + 0.025 * pulse * rv(t, 20.1, 0.3));
  const dy = lerp(30, 0, p);
  return `<g opacity="${f2(p)}" transform="translate(${LC[0]} ${f2(LC[1] + dy)}) scale(${f2(s)})">
    <circle cy="-8" r="${f2(104 + 6 * pulse)}" fill="${RED}" opacity="${f2(0.06 + 0.06 * pulse)}"/>
    ${T(0, -58, 'Day', { size: 30, w: 600, fill: '#E9A29C', anchor: 'middle' })}
    <text x="0" y="26" text-anchor="middle" font-family="Inter" font-weight="800" font-size="88" fill="${RED}" style="filter:drop-shadow(0 0 18px rgba(255,90,78,${f2(0.25 + 0.3 * pulse)}))">30?</text></g>`;
}
function sceneLoop(t) {
  const pc = rv(t, 0, 0.4);
  let body = `<g ${SH}><rect x="300" y="110" width="1320" height="860" rx="16" fill="${CARD}" stroke="${BORDER}"/></g>`;
  body += ring(t, rv(t, 1.3, 0.5));
  body += comet(t);
  const I = intensities(t);
  for (let k = 0; k < 4; k++) body += node(k, t, I[k], rv(t, 0.45 + k * 0.22, 0.35));
  body += dayCounter(t);
  body += convChip(t);
  body += mood(t);
  const sat = lerp(1, 0.06, eio((t - 16.7) / 1.4));
  const dim = 0.22 * eio((t - 16.7) / 1.4);
  let g = `<filter id="desat" x="0" y="0" width="1920" height="1080" filterUnits="userSpaceOnUse"><feColorMatrix type="saturate" values="${f2(sat)}"/></filter>`;
  g += `<g filter="url(#desat)">${pop(pc, 960, 540, body)}</g>`;
  if (dim > 0) g += `<rect width="1920" height="1080" fill="#000" opacity="${f2(dim)}"/>`;
  g += day30(t);
  const z = 1; // static framing (no camera push)
  return `<g transform="translate(960 540) scale(${f2(z)}) translate(-960 -540)">${g}</g>`;
}

window.renderAt = function (t) {
  const body = SCENE === 'loop' ? sceneLoop(t) : sceneCalendar(t);
  stage.style.filter = '';
  stage.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
};
window.ready = (async () => {
  await Promise.all(['400 40px Inter', '600 40px Inter', '700 48px Inter', '800 100px Inter', '500 40px "JetBrains Mono"', '700 48px "JetBrains Mono"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  window.renderAt(0);
  return true;
})();
</script></body></html>
